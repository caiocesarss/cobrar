<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobranca CUB</title>
<style>
  :root {
    --paper: #f2ede2;
    --paper-line: #d8cfba;
    --ink: #2a2620;
    --ink-soft: #6b6455;
    --accent: #3d6b52;
    --accent-soft: #e4ede8;
    --danger: #a3432f;
    --bg: #14120f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { text-align: center; margin-bottom: 24px; }
  header .eyebrow {
    color: #a89c82;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 600;
  }
  header h1 {
    color: #f2ede2;
    font-size: 24px;
    margin: 6px 0 0;
    font-weight: 700;
  }

  .card {
    background: var(--paper);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 16px);
    opacity: .15;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-soft);
    margin: 0 0 14px;
    font-weight: 700;
  }

  .status-line {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px dashed var(--paper-line);
    font-size: 14px;
  }
  .status-line:last-child { border-bottom: none; }
  .status-line .label { color: var(--ink-soft); }
  .status-line .value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .status-line.total .value { color: var(--danger); font-size: 16px; }

  .pagamentos-list { margin-top: 10px; }
  .pagamentos-list .item {
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    color: var(--ink-soft);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 12px 0 4px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    background: #fff;
    font-size: 15px;
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[readonly] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .02em;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: var(--accent-soft); color: var(--accent); }
  .btn-copy { background: var(--ink); color: var(--paper); }

  .receipt {
    font-family: "SF Mono", "Courier New", monospace;
    font-size: 13.5px;
    white-space: pre-wrap;
    line-height: 1.6;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 14px;
    margin-top: 10px;
    user-select: all;
  }

  .msg { font-size: 12px; margin-top: 8px; }
  .msg.ok { color: var(--accent); }
  .msg.err { color: var(--danger); }

  .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .tabs button {
    margin-top: 0;
    flex: 1;
    background: transparent;
    border: 1px solid var(--paper-line);
    color: var(--ink-soft);
    font-size: 12px;
    padding: 8px;
  }
  .tabs button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .hidden { display: none; }

  .config-note {
    font-size: 12px;
    color: #a89c82;
    text-align: center;
    margin-top: 24px;
    line-height: 1.6;
  }
  .config-note code { color: #d8cfba; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Controle mensal</div>
    <h1>Cobranca CUB</h1>
  </header>

  <div class="card" id="cardStatus">
    <h2>Status do mes atual</h2>
    <div id="statusBody">Carregando...</div>
  </div>

  <div class="card">
    <h2>Registrar</h2>
    <div class="tabs">
      <button id="tabPix" class="active">Novo PIX</button>
      <button id="tabMes">Novo mes</button>
    </div>

    <div id="formPix">
      <label for="pixValor">Valor (R$)</label>
      <input type="number" step="0.01" id="pixValor" placeholder="65.00">
      <label for="pixData">Data do pagamento</label>
      <input type="date" id="pixData">
      <label for="pixNome">Pago por (opcional)</label>
      <input type="text" id="pixNome" placeholder="Nome">
      <button class="btn-primary" onclick="enviarPagamento()">Adicionar PIX</button>
    </div>

    <div id="formMes" class="hidden">
      <label for="mesData">Data de referencia do mes</label>
      <input type="date" id="mesData">
      <label for="mesIndiceDisplay">Indice (fixo)</label>
      <input type="text" id="mesIndiceDisplay" readonly>
      <label for="mesCub">Valor do CUB do mes</label>
      <input type="number" step="0.01" id="mesCub" placeholder="3151.24">
      <button class="btn-secondary" onclick="calcularParcela()">Calcular</button>
      <label for="mesParcelaDisplay">Valor da parcela (calculado)</label>
      <input type="text" id="mesParcelaDisplay" readonly placeholder="Clique em Calcular">
      <button class="btn-primary" onclick="enviarMes()">Adicionar mes</button>
    </div>

    <div id="msgArea"></div>
  </div>

  <div class="card">
    <h2>Texto para WhatsApp</h2>
    <button class="btn-secondary" onclick="gerarTexto()">Gerar texto</button>
    <div id="receiptWrap" class="hidden">
      <div class="receipt" id="receiptText"></div>
      <button class="btn-copy" onclick="copiarTexto()">Copiar</button>
      <div class="msg" id="copyMsg"></div>
    </div>
  </div>

  <div class="config-note">
    Configure a URL do Apps Script na constante <code>API_URL</code>
    dentro deste arquivo antes de publicar.
  </div>
</div>

<script>
// ==== CONFIGURACAO ====
// Cole aqui a URL do seu Apps Script Web App (termina em /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbyoMhTgwvW_FvwwGXKg115Br-fcs4zdyf33_Xz6YI9ObGpqfO0aahWAGhO2aSIRKwo2/exec";

let statusAtual = null;
let indiceFixo = null;
let parcelaCalculada = null;

function getSenha() {
  let senha = sessionStorage.getItem('cub_senha');
  while (!senha) {
    senha = prompt('Digite a senha de acesso:');
    if (senha) sessionStorage.setItem('cub_senha', senha);
  }
  return senha;
}

function fmt(v) {
  return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtIdx(v) {
  return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
}
function mostrarMsg(texto, tipo) {
  const el = document.getElementById('msgArea');
  el.innerHTML = '<div class="msg ' + tipo + '">' + texto + '</div>';
  setTimeout(() => { el.innerHTML = ''; }, 4000);
}

async function carregarStatus() {
  const body = document.getElementById('statusBody');
  try {
    const senha = getSenha();
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
      body: JSON.stringify({ action: 'getStatus', senha: senha })
    });
    const data = await resp.json();
    if (data.erro) {
      if (data.erro.includes('Senha')) sessionStorage.removeItem('cub_senha');
      body.innerHTML = '<div class="msg err">' + data.erro + ' Recarregue a pagina para tentar de novo.</div>';
      return;
    }
    statusAtual = data;
    indiceFixo = data.indice;
    const indiceDisplayEl = document.getElementById('mesIndiceDisplay');
    if (indiceDisplayEl) indiceDisplayEl.value = fmtIdx(data.indice);

    let html = '';
    html += linha('Mes', data.mesNome + ' ' + data.ano);
    html += linha('CUB', 'R$ ' + fmt(data.cub));
    html += linha('Indice', fmtIdx(data.indice));
    html += linha('Saldo anterior', 'R$ ' + fmt(data.saldoAnterior));
    html += linha('Total do mes', 'R$ ' + fmt(data.totalMes));
    html += linha('Ja pago', 'R$ ' + fmt(data.totalPago));
    html += linha('A pagar', 'R$ ' + fmt(data.aPagar), true);
    html += linha('Total vencido (geral)', 'R$ ' + fmt(data.totalCorrigidoGeral));
    html += linha('Total pago (geral)', 'R$ ' + fmt(data.totalTransferidoGeral));
    if (data.pagamentos.length) {
      html += '<div class="pagamentos-list">';
      data.pagamentos.forEach(p => {
        html += '<div class="item"><span>' + p.dataTexto + (p.nome ? ' - ' + p.nome : '') + '</span><span>R$ ' + fmt(p.valor) + '</span></div>';
      });
      html += '</div>';
    }
    body.innerHTML = html;
  } catch (err) {
    body.innerHTML = '<div class="msg err">Nao foi possivel carregar. Confira a URL da API.</div>';
  }
}

function linha(label, valor, total) {
  return '<div class="status-line' + (total ? ' total' : '') + '"><span class="label">' + label + '</span><span class="value">' + valor + '</span></div>';
}

document.getElementById('tabPix').onclick = () => alternarTab('pix');
document.getElementById('tabMes').onclick = () => alternarTab('mes');
function alternarTab(qual) {
  document.getElementById('formPix').classList.toggle('hidden', qual !== 'pix');
  document.getElementById('formMes').classList.toggle('hidden', qual !== 'mes');
  document.getElementById('tabPix').classList.toggle('active', qual === 'pix');
  document.getElementById('tabMes').classList.toggle('active', qual === 'mes');
}

async function enviarPagamento() {
  const valor = document.getElementById('pixValor').value;
  const data = document.getElementById('pixData').value;
  const nome = document.getElementById('pixNome').value;
  if (!valor || !data) { mostrarMsg('Preencha valor e data.', 'err'); return; }
  await postAcao({ action: 'addPagamento', valor: valor, data: data, nome: nome });
}

function calcularParcela() {
  const cub = parseFloat(document.getElementById('mesCub').value);
  if (!indiceFixo) { mostrarMsg('Indice ainda nao carregado. Aguarde o status carregar.', 'err'); return; }
  if (!cub || cub <= 0) { mostrarMsg('Informe o valor do CUB do mes.', 'err'); return; }
  parcelaCalculada = indiceFixo * cub;
  document.getElementById('mesParcelaDisplay').value = 'R$ ' + fmt(parcelaCalculada);
}

async function enviarMes() {
  const data = document.getElementById('mesData').value;
  const cub = document.getElementById('mesCub').value;
  if (!data || !cub) { mostrarMsg('Preencha data e valor do CUB.', 'err'); return; }
  if (!parcelaCalculada) { mostrarMsg('Clique em Calcular antes de adicionar.', 'err'); return; }
  await postAcao({ action: 'addMes', data: data, indice: indiceFixo, cub: cub, valorParcela: parcelaCalculada });
  parcelaCalculada = null;
  document.getElementById('mesParcelaDisplay').value = '';
  document.getElementById('mesCub').value = '';
}

async function postAcao(payload) {
  try {
    payload.senha = getSenha();
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (data.erro) {
      if (data.erro.includes('Senha')) sessionStorage.removeItem('cub_senha');
      mostrarMsg(data.erro, 'err');
      return;
    }
    mostrarMsg('Salvo com sucesso.', 'ok');
    statusAtual = data.status;
    carregarStatus();
    document.getElementById('receiptWrap').classList.add('hidden');
  } catch (err) {
    mostrarMsg('Erro ao salvar. Confira a URL da API.', 'err');
  }
}

// alinha "label" + "valor" em colunas fixas, tipo recibo monoespacado
function linhaFmt(label, valor, largura) {
  largura = largura || 18;
  const rotulo = (label + ' ').padEnd(largura, '.');
  return rotulo + ' ' + valor.padStart(13) + '\n';
}

function gerarTexto() {
  if (!statusAtual) { mostrarMsg('Status ainda nao carregado.', 'err'); return; }
  const s = statusAtual;

  // dentro de um bloco ``` o WhatsApp usa fonte monoespacada (Courier),
  // mas ignora *negrito* dentro do bloco - por isso a formatacao usa
  // alinhamento em colunas em vez de negrito.
  let texto = '```\n';
  texto += '📋 ATUALIZAÇÃO DA PARCELA\n';
  texto += 'Mês de referencia: ' + s.mesNome + '/' + s.ano + '\n\n';

  texto += '💰 CÁLCULO DA PARCELA\n';
  texto += linhaFmt('Índice', fmtIdx(s.indice));
  texto += linhaFmt('CUB do mÊs', 'R$ ' + fmt(s.cub));
  texto += linhaFmt('Valor corrigido', 'R$ ' + fmt(s.mult));
  texto += '\n';

  texto += '📊 RESUMO FINANCEIRO\n';
  texto += linhaFmt('Saldo anterior', 'R$ ' + fmt(s.saldoAnterior));
  texto += linhaFmt('Total do mes', 'R$ ' + fmt(s.totalMes));
  texto += linhaFmt('Total devido', 'R$ ' + fmt(s.saldoAnterior + s.totalMes));
  texto += '\n';

  if (s.pagamentos.length) {
    texto += '✅ PAGAMENTOS RECEBIDOS\n';
    let totalPago = 0;
    s.pagamentos.forEach(p => {
      const rotulo = p.dataTexto + (p.nome ? ' ' + p.nome : '');
      texto += linhaFmt(rotulo, 'R$ ' + fmt(p.valor));
      totalPago += Number(p.valor);
    });
    texto += linhaFmt('Total pago', 'R$ ' + fmt(totalPago));
    texto += '\n';
  }

  texto += linhaFmt('🔴 A PAGAR', 'R$ ' + fmt(s.aPagar), 16);
  texto += '```\n';
  texto += 'Qualquer dúvida, só chamar! 🙏';

  document.getElementById('receiptText').innerText = texto;
  document.getElementById('receiptWrap').classList.remove('hidden');
}

async function copiarTexto() {
  const texto = document.getElementById('receiptText').innerText;
  const msg = document.getElementById('copyMsg');
  try {
    await navigator.clipboard.writeText(texto);
    msg.textContent = 'Copiado!';
    msg.className = 'msg ok';
  } catch (err) {
    // fallback: seleciona o texto para copia manual (funciona bem no mobile)
    const range = document.createRange();
    range.selectNode(document.getElementById('receiptText'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    msg.textContent = 'Texto selecionado - toque e segure para copiar.';
    msg.className = 'msg ok';
  }
  setTimeout(() => { msg.textContent = ''; }, 3000);
}

carregarStatus();
</script>
</body>
</html>
